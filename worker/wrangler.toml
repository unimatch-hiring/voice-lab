name = "voice-lab-token-minter"
main = "index.js"
compatibility_date = "2026-08-05"

# Workers Logs: every request and every console.log is kept and searchable in the
# dashboard (Workers -> voice-lab-token-minter -> Logs), not only while someone runs
# `wrangler tail`. Refusals log one JSON line each: reason, path, origin, method.
# Traffic is a few interviews a day, so sampling everything costs nothing.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# The ElevenLabs Agent this page talks to. Not a secret: a session token is still
# required, and that is minted server-side.
AGENT_ID = "agent_6701kzf2723mf3dtp7ben1j5dczt"
# Who may call the Worker from a browser: the deployed frontend on GitHub Pages
# plus local development. Only this list reaches /admin/. The candidate's endpoints
# also answer PREVIEW_ORIGINS, http://localhost and http://127.0.0.1 on any port, and
# calls without an Origin (a candidate's own backend) — the interview key guards those. Origins include the scheme and no trailing slash.
# :5173 is the dev server, :4173 is `vite preview`, where the production build is
# checked before deploying — without the second port that check is impossible.
ALLOWED_ORIGINS = "https://unimatch-hiring.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173"
# Pull request previews, built from unreviewed code and served from another account's
# Pages so they share no storage with the admin page. They reach the candidate's
# endpoints only, never /admin/.
PREVIEW_ORIGINS = "https://unimatch-screening.github.io"
# Models the LLM proxy (/llm/v1/) forwards to OpenRouter: cheap text models for task E's
# phrase classifier. Anything else is 400. Editing the list is a deploy, not a code change.
# A model added here must cost under CEILING_USD_PER_TOKEN in llm.js ($10/M tokens, in and
# out): the budget reserves at that price, so a dearer model could bill past it. No reasoning
# models either: their thinking eats max_tokens and the answer comes back empty.
LLM_MODELS = "openai/gpt-4o-mini,openai/gpt-4.1-mini,openai/gpt-4.1-nano,google/gemini-2.5-flash-lite,meta-llama/llama-3.3-70b-instruct,mistralai/mistral-small-3.2-24b-instruct,qwen/qwen3-30b-a3b-instruct-2507"
# Ceiling on max_tokens per call; with it one call costs at most a fraction of a cent.
LLM_MAX_TOKENS = "1024"

# Interview keys, one entry per issued key, expiring by KV's own TTL so nothing has
# to sweep them. Every caller holds one of these; there is no permanent token.
[[kv_namespaces]]
binding = "KEYS"
id = "5fc3e04365264ee897f5569ea3aafbbe"

# Rate limits count per Cloudflare location and are permissive by design: they raise the
# price of a script rather than cap it. The exact counting lives in AddressGuard below.
# Sign-in, keyed by the address being signed into.
[[ratelimits]]
name = "SIGNIN_LIMIT"
namespace_id = "1001"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "VERIFY_LIMIT"
namespace_id = "1002"
[ratelimits.simple]
limit = 10
period = 60

# The same two, keyed by the caller's IP, so one machine cannot spread guesses over many
# addresses. Namespace ids are account-wide: another Worker reusing one shares its counters.
[[ratelimits]]
name = "SIGNIN_IP_LIMIT"
namespace_id = "4281"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "VERIFY_IP_LIMIT"
namespace_id = "4282"
[ratelimits.simple]
limit = 20
period = 60

# Token endpoints spend ElevenLabs and Deepgram minutes. A conversation needs one token;
# 20 a minute per key: six stopped a candidate mid-interview on 23.11 (a page that
# reconnects, or a retry loop in their code, burns through six fast). Still cheap for a
# leaked key, and the per-IP limit below caps one machine anyway.
[[ratelimits]]
name = "TOKEN_KEY_LIMIT"
namespace_id = "4283"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "TOKEN_IP_LIMIT"
namespace_id = "4284"
[ratelimits.simple]
limit = 30
period = 60

# The LLM proxy: a classifier fires a call per phrase, so it gets more room than token
# minting. The dollar budget per key is the real cap; this only slows a runaway loop.
[[ratelimits]]
name = "LLM_LIMIT"
namespace_id = "4285"
[ratelimits.simple]
limit = 120
period = 60

# One object per admin address: the live code, its tries, the daily ceiling and the alert
# window, counted atomically — see guard.js.
[[durable_objects.bindings]]
name = "GUARD"
class_name = "AddressGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AddressGuard"]

# One object per interview key: dollars spent through the LLM proxy, charged atomically
# and dropped when the key expires — see llm.js.
[[durable_objects.bindings]]
name = "LLM_BUDGET"
class_name = "LlmBudget"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LlmBudget"]
