name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Nothing here writes anything back.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the token stays behind in .git/config for every later step.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: a dependency's install hook is arbitrary code running before
      # any of ours, and npm runs it by default. Nothing here needs one — esbuild ships
      # its binary as an optional dependency — so the whole class is simply switched off.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
