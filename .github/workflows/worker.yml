name: Deploy Worker

# Separate from the Pages deploy on purpose: a change to the frontend has no business
# redeploying the token minter, and the Worker holds the API keys.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run defaults to the branch tip, which may already be a newer commit
          # than the one CI passed on. Deploy exactly what was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Skip when the Worker did not change
        id: changed
        run: |
          # A hand-started run means "deploy now" — asking whether the last commit
          # happened to touch worker/ made the button do nothing at all.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD | grep -q '^worker/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Wrangler's own failure for a missing token is a wall of text at the end of a log
      # nobody opens. Say it here instead, with the fix.
      - name: Check the deploy credentials exist
        if: steps.changed.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            {
              echo "### Worker not deployed"
              echo
              echo 'The repository has no `CLOUDFLARE_API_TOKEN`, so this change is merged but not live.'
              echo
              echo 'Create a token with **Workers Scripts: Edit**, then:'
              echo '```sh'
              echo 'gh secret set CLOUDFLARE_API_TOKEN --repo unimatch-hiring/voice-lab'
              echo 'gh run rerun --repo unimatch-hiring/voice-lab --workflow "Deploy Worker"'
              echo '```'
              echo
              echo 'Meanwhile it can be shipped by hand: `cd worker && npx wrangler@4 deploy`.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CLOUDFLARE_API_TOKEN is not set — the Worker was not deployed. See the run summary."
            exit 1
          fi
      - name: Deploy
        if: steps.changed.outputs.run == 'true'
        working-directory: worker
        env:
          # Scoped to Workers Scripts:Edit on one account — no DNS, no zones, no billing.
          # Secrets bound to the Worker (API keys) are set once with `wrangler secret put`
          # and are not touched by a deploy, so they never pass through CI.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
