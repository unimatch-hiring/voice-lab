name: Deploy to GitHub Pages

# Gated on CI rather than triggered by the push: two workflows on the same event run in
# parallel, so the site published even when the tests were red.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A failed CI run still reports "completed", so the conclusion has to be checked.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # `id-token: write` lets this job mint an OIDC identity for the repository, so it
      # is worth knowing where it talks even though no cloud key is mounted here.
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_run defaults to the branch tip, which may already be a newer commit
          # than the one CI passed on. Deploy exactly what was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # Same reasoning as CI: no dependency here needs an install hook, so none runs.
      - run: npm ci --ignore-scripts

      - run: npm run build
        env:
          # The token-minter's address. A repository variable, not a secret: it ends
          # up in the bundle and is visible in the browser — the Worker is protected
          # by its origin list and the token, not by its address being unknown.
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
