name: Deploy to GitHub Pages

# Gated on CI rather than triggered by the push: two workflows on the same event run in
# parallel, so the site published even when the tests were red.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A failed CI run still reports "completed", so the conclusion has to be checked.
    # Same reasoning as the Worker deploy: `branches: [main]` filters the triggering
    # run's branch, and a fork's branch can be named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # This job builds the code, so it is the one worth watching even though the
      # credential to publish now lives in the job below it.
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run defaults to the branch tip, which may already be a newer commit
          # than the one CI passed on. Deploy exactly what was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      # No `cache: npm` on purpose. The cache is writable from an ordinary pull
      # request and restored here, where the build output goes straight to the live
      # site — a cheap way to have a PR ship code it never got reviewed for. CI keeps
      # its cache; that job publishes nothing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Same reasoning as CI: no dependency here needs an install hook, so none runs.
      - run: npm ci --ignore-scripts

      - run: npm run build
        env:
          # The token-minter's address. A repository variable, not a secret: it ends
          # up in the bundle and is visible in the browser — the Worker is protected
          # by its origin list and the token, not by its address being unknown.
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the job that publishes needs to write Pages or mint an identity token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
