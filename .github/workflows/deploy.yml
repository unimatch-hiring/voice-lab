name: Deploy to GitHub Pages

# Gated on CI rather than triggered by the push: two workflows on the same event run in
# parallel, so the site published even when the tests were red.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Branch previews write to the same branch, so the two cannot push at once.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    # A failed CI run still reports "completed", so the conclusion has to be checked.
    # Same reasoning as the Worker deploy: `branches: [main]` filters the triggering
    # run's branch, and a fork's branch can be named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # This job builds the code, so it is the one worth watching even though the
      # credential to publish now lives in the job below it.
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run defaults to the branch tip, which may already be a newer commit
          # than the one CI passed on. Deploy exactly what was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      # No `cache: npm` on purpose. The cache is writable from an ordinary pull
      # request and restored here, where the build output goes straight to the live
      # site — a cheap way to have a PR ship code it never got reviewed for. CI keeps
      # its cache; that job publishes nothing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Same reasoning as CI: no dependency here needs an install hook, so none runs.
      - run: npm ci --ignore-scripts

      - run: npm run build
        env:
          # The token-minter's address. A repository variable, not a secret: it ends
          # up in the bundle and is visible in the browser — the Worker is protected
          # by its origin list and the token, not by its address being unknown.
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The only job with a credential that writes. It never runs project code: it moves
    # files the build already produced.
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
          # Kept on purpose: this checkout is the one that pushes.
          persist-credentials: true
        continue-on-error: true

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: site
          path: dist

      - name: Publish to gh-pages
        env:
          BRANCH: gh-pages
        run: |
          set -euo pipefail

          # First deploy after the switch to a published branch: there is nothing to
          # check out, so start the branch here.
          if [ ! -d site/.git ]; then
            rm -rf site
            mkdir site
            git -C site init -q -b "$BRANCH"
            git -C site remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          fi

          # Everything in the root belongs to main's build and is replaced wholesale.
          # `pr-preview/` does not: branch previews live there and outlive any one deploy.
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name pr-preview -exec rm -rf {} +
          cp -R dist/. site/
          # Pages runs Jekyll otherwise, which drops files whose names start with an
          # underscore — Vite emits none today, but a plugin that does would be a silent
          # 404 rather than a build error.
          touch site/.nojekyll

          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet --cached && { echo "site unchanged"; exit 0; }
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -q origin "HEAD:$BRANCH"
