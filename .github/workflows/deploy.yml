name: Deploy to GitHub Pages

# Gated on CI rather than triggered by the push: two workflows on the same event run in
# parallel, so the site published even when the tests were red.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A failed CI run still reports "completed", so the conclusion has to be checked.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run defaults to the branch tip, which may already be a newer commit
          # than the one CI passed on. Deploy exactly what was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The token-minter's address. A repository variable, not a secret: it ends
          # up in the bundle and is visible in the browser — the Worker is protected
          # by its origin list and the token, not by its address being unknown.
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
